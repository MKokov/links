<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moosabek — ссылки и ассистент</title>
<meta name="description" content="Lead QA, 10 лет опыта. Консультации по инструментам, автоматизации и AI. Проекты: Yejapa, Тени.">
<meta name="theme-color" content="#0d1512">
<style>
  :root{
    --bg:#0d1512; --card:#15201b; --card2:#1b2a23; --line:#26382f;
    --text:#eef3ef; --muted:#93a69b; --accent:#3fae6a; --gold:#e3b64a;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;display:flex;justify-content:center;padding:28px 16px 40px;
    background:radial-gradient(900px 500px at 50% -10%,rgba(63,174,106,.18),transparent 60%),var(--bg)}
  .wrap{width:100%;max-width:480px}

  header{text-align:center;margin-bottom:22px}
  .avatar{width:92px;height:92px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#1f6b41);font-size:34px;font-weight:700;color:#fff;
    box-shadow:0 0 0 3px var(--bg),0 0 0 5px rgba(227,182,74,.6);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .handle{color:var(--muted);font-size:14px;margin-top:2px}
  .bio{color:#c9d6ce;font-size:15px;line-height:1.45;margin-top:10px}

  .links{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
  .link{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius);
    background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;
    transition:transform .12s ease,background .12s ease}
  .link:active{transform:scale(.98)}
  .link:hover{background:var(--card2)}
  .link .ic{font-size:22px;width:28px;text-align:center;flex-shrink:0}
  .link .t{flex:1;min-width:0}
  .link .t b{display:block;font-size:15px;font-weight:600}
  .link .t span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
  .link .arr{color:var(--muted);font-size:18px}
  .link.main{background:linear-gradient(135deg,#1f6b41,#2c8a55);border-color:transparent}
  .link.main .t span{color:#d5eedd}

  .chat{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
  .chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .chat-head b{font-size:15px}
  .chat-head span{font-size:12px;color:var(--muted);margin-left:auto}
  .msgs{height:340px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .m{max-width:85%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .m.bot{background:var(--card2);align-self:flex-start;border-bottom-left-radius:5px}
  .m.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
  .m.err{background:#3a1f1f;color:#f3c3c3}
  .m a{color:var(--gold)}
  .typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:#c9d6ce;font-size:13px;cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--accent);color:#fff}

  form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
  input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    color:var(--text);font-size:16px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button.send{width:46px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
  button.send:disabled{opacity:.5}
  footer{text-align:center;color:#5d7066;font-size:12px;margin-top:18px}

  .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
  .tag{font-size:12px;color:#c9d6ce;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .cta{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border:0;border-radius:var(--radius);
    background:var(--gold);color:#1a1405;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:10px}
  .cta:active{transform:scale(.98)}
  .m .book{display:block;margin-top:8px;padding:8px 12px;border:0;border-radius:10px;background:var(--gold);color:#1a1405;
    font-weight:600;font-size:13.5px;font-family:inherit;cursor:pointer}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.open{display:flex}
  .sheet{display:block;width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px 26px}
  @media(min-width:520px){.modal{align-items:center}.sheet{border-radius:22px}}
  .sheet h2{font-size:18px;margin-bottom:4px}
  .sheet p{color:var(--muted);font-size:14px;margin-bottom:14px}
  .sheet label{display:block;font-size:13px;color:#c9d6ce;margin:10px 0 5px}
  .sheet input,.sheet textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;
    color:var(--text);font-size:16px;font-family:inherit;outline:none}
  .sheet textarea{min-height:90px;resize:vertical}
  .sheet input:focus,.sheet textarea:focus{border-color:var(--accent)}
  .sheet .row{display:flex;gap:8px;margin-top:16px}
  .sheet .row button{flex:1;padding:13px;border-radius:12px;border:0;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .sheet .cancel{background:transparent;border:1px solid var(--line)!important;color:var(--text)}
  .sheet .submit{background:var(--accent);color:#fff}
  .sheet .submit:disabled{opacity:.5}
  .sheet .status{margin-top:12px;font-size:14px;min-height:20px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <div class="handle" id="handle"></div>
    <p class="bio" id="bio"></p>
    <div class="tags" id="tags"></div>
  </header>

  <button class="cta" id="cta" type="button">📅 Записаться на консультацию</button>
  <nav class="links" id="links"></nav>

  <section class="chat" aria-label="AI-ассистент">
    <div class="chat-head">
      <div class="dot"></div><b>AI-ассистент</b><span>отвечает 24/7</span>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="Спросите что-нибудь…" maxlength="500">
      <button class="send" id="send" aria-label="Отправить">➤</button>
    </form>
  </section>

  <footer id="footer"></footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <form class="sheet" id="leadForm" autocomplete="on">
    <h2 id="mtitle">Запись на консультацию</h2>
    <p>Оставьте контакт и коротко опишите задачу — Муса свяжется с вами.</p>
    <label for="lName">Как вас зовут</label>
    <input id="lName" name="name" required maxlength="100" autocomplete="name">
    <label for="lContact">Как связаться (Telegram, Instagram или телефон)</label>
    <input id="lContact" name="contact" required maxlength="150" placeholder="@username">
    <label for="lTask">С чем нужна помощь</label>
    <textarea id="lTask" name="task" maxlength="1500" placeholder="Например: хочу автоматизировать отчёты / подобрать AI-инструменты для команды"></textarea>
    <div class="hp" aria-hidden="true"><input name="website" id="lWeb" tabindex="-1" autocomplete="off"></div>
    <div class="row">
      <button type="button" class="cancel" id="lCancel">Отмена</button>
      <button type="submit" class="submit" id="lSubmit">Отправить</button>
    </div>
    <div class="status" id="lStatus"></div>
  </form>
</div>

<script>
/* ============================================================
   НАСТРОЙКИ — меняйте только этот блок
   ============================================================ */
const CONFIG = {
  // Адрес Cloudflare Worker с ассистентом
  WORKER_URL: "https://moosabek-ai.kokovmusa.workers.dev",

  name:   "Муса",
  handle: "@moosabek",
  bio:    "Lead QA-инженер, 10 лет опыта. Помогаю бизнесу с инструментами, автоматизацией и AI. Делаю свои проекты.",
  tags:   ["QA и тестирование", "Автоматизация", "AI и промпты", "Подбор инструментов"],
  avatar: "",          // ссылка на фото, например "avatar.jpg" (положите файл рядом). Пусто — будет буква.

  links: [
    { icon:"📖", title:"Yejapa — читать с переводом на адыгэбзэ", sub:"yejapa.com", url:"https://yejapa.com", main:true },
    { icon:"🌙", title:"Тени — игра про тревогу", sub:"Назови страх словами и вырасти свой сад", url:"https://mkokov.github.io/teni/" },
    { icon:"📸", title:"Instagram", sub:"@moosabek", url:"https://instagram.com/moosabek" },
    // { icon:"✈️", title:"Telegram", sub:"@your_channel", url:"https://t.me/your_channel" },
    { icon:"✉️", title:"Написать по Yejapa", sub:"hello@yejapa.com", url:"mailto:hello@yejapa.com" },
  ],

  greeting: "Привет! 👋 Я AI-ассистент Мусы. Расскажу, чем он может помочь с QA, автоматизацией и AI, про его проекты, и помогу записаться на консультацию.",
  suggestions: ["Чем Муса может помочь?", "Хочу внедрить AI в работу", "Что такое Yejapa?", "Как записаться на консультацию?"],
};
/* ============================================================ */

const $ = id => document.getElementById(id);
$("name").textContent = CONFIG.name;
$("handle").textContent = CONFIG.handle;
$("bio").textContent = CONFIG.bio;
$("tags").innerHTML = (CONFIG.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
$("footer").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;
if (CONFIG.avatar) $("avatar").innerHTML = `<img src="${CONFIG.avatar}" alt="">`;
else $("avatar").textContent = CONFIG.name.trim()[0] || "•";

$("links").innerHTML = CONFIG.links.map(l => `
  <a class="link${l.main ? " main" : ""}" href="${l.url}" target="_blank" rel="noopener">
    <span class="ic">${l.icon}</span>
    <span class="t"><b>${l.title}</b>${l.sub ? `<span>${l.sub}</span>` : ""}</span>
    <span class="arr">›</span>
  </a>`).join("");

const msgs = $("msgs"), input = $("input"), send = $("send"), chips = $("chips");
const history = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s)]+|[\w.+-]+@[\w-]+\.[\w.]+)/g,m=>
  m.includes("@")&&!m.startsWith("http")?`<a href="mailto:${m}">${m}</a>`:`<a href="${m}" target="_blank" rel="noopener">${m}</a>`)}
function add(text, who){
  const d = document.createElement("div");
  d.className = "m " + who;
  d.innerHTML = linkify(text);
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  return d;
}

add(CONFIG.greeting, "bot");
chips.innerHTML = CONFIG.suggestions.map(s => `<button class="chip" type="button">${esc(s)}</button>`).join("");
chips.querySelectorAll(".chip").forEach(b => b.onclick = () => ask(b.textContent));

async function ask(text){
  text = text.trim();
  if (!text || send.disabled) return;
  chips.style.display = "none";
  add(text, "me");
  history.push({ role:"user", content:text });
  input.value = ""; send.disabled = true;

  const t = add("", "bot");
  t.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

  try {
    if (!CONFIG.WORKER_URL) throw new Error("demo");
    const r = await fetch(CONFIG.WORKER_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ messages: history.slice(-10) }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "error");
    const wantsBooking = data.reply.includes("[ЗАПИСЬ]");
    const reply = data.reply.replace(/\s*\[ЗАПИСЬ\]\s*/g, " ").trim();
    t.innerHTML = linkify(reply);
    if (wantsBooking) {
      const b = document.createElement("button");
      b.className = "book"; b.type = "button"; b.textContent = "📅 Записаться на консультацию";
      b.onclick = openLead; t.appendChild(b);
      msgs.scrollTop = msgs.scrollHeight;
    }
    history.push({ role:"assistant", content:reply });
  } catch (e) {
    history.pop();
    t.className = "m bot err";
    t.textContent = e.message === "demo"
      ? "Ассистент ещё не подключён (демо-режим). Укажите WORKER_URL в настройках — см. README."
      : (e.message === "rate_limited"
          ? "Слишком много сообщений подряд. Попробуйте через минуту 🙏"
          : "Не получилось ответить. Попробуйте ещё раз или напишите в директ " + CONFIG.handle);
  } finally {
    send.disabled = false; input.focus();
  }
}

$("form").onsubmit = e => { e.preventDefault(); ask(input.value); };

// ---------- Запись на консультацию ----------
const modal = $("modal"), leadForm = $("leadForm"), lStatus = $("lStatus"), lSubmit = $("lSubmit");
function openLead(){ modal.classList.add("open"); lStatus.textContent = ""; setTimeout(() => $("lName").focus(), 50); }
function closeLead(){ modal.classList.remove("open"); }
$("cta").onclick = openLead;
$("lCancel").onclick = closeLead;
modal.onclick = e => { if (e.target === modal) closeLead(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLead(); });

leadForm.onsubmit = async e => {
  e.preventDefault();
  lSubmit.disabled = true; lStatus.style.color = ""; lStatus.textContent = "Отправляю…";
  try {
    const r = await fetch(CONFIG.WORKER_URL + "/lead", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name:$("lName").value, contact:$("lContact").value, task:$("lTask").value, website:$("lWeb").value }),
    });
    if (!r.ok) throw new Error();
    leadForm.reset();
    lStatus.style.color = "#7fd59f";
    lStatus.textContent = "Готово! Заявка у Мусы, он скоро с вами свяжется 🙌";
    setTimeout(closeLead, 2500);
  } catch {
    lStatus.style.color = "#f3a3a3";
    lStatus.textContent = "Не удалось отправить. Попробуйте ещё раз или напишите в директ " + CONFIG.handle;
  } finally { lSubmit.disabled = false; }
};
</script>
</body>
</html>
