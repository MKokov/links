<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Муса · @moosabek</title>
<meta name="description" content="Lead QA, 10 лет опыта. Консультации по инструментам, автоматизации и AI. Проекты: Yejapa, Тени.">
<meta name="theme-color" content="#1c1e21">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#1c1e21; --bg2:#16181a; --card:#24272b; --card2:#2a2e33; --line:#363a40;
    --text:#f2f3f4; --muted:#a6abb1; --accent:#f2f3f4; --on-accent:#16181a; --lime:#c6f432;
    --radius:12px; --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  html{background:var(--bg2)}
  body{min-height:100dvh;display:flex;justify-content:center;padding:36px 18px 40px;
    background:linear-gradient(180deg,#25282c 0%,var(--bg) 340px,var(--bg2) 100%)}
  .wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:22px}
  svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
  .avatar{width:104px;height:104px;border-radius:50%;margin-bottom:6px;overflow:hidden;background:var(--card);
    border:2px solid var(--line);box-shadow:0 0 0 4px var(--bg)}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.01em}
  .handle{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .bio{font-size:15px;line-height:1.5;margin-top:6px;max-width:340px}
  .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
  .tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:5px 10px}

  .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border:0;border-radius:var(--radius);
    background:var(--accent);color:var(--on-accent);font-family:var(--sans);font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s}
  .cta:active{transform:scale(.98)}
  .cta:hover{background:#ffffff}

  .links{display:flex;flex-direction:column;gap:10px}
  .link{display:flex;align-items:center;gap:14px;padding:14px;min-height:44px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--text);text-decoration:none;transition:background .12s,border-color .12s}
  .link:hover{background:var(--card2);border-color:#454a51}
  .link:active{transform:scale(.99)}
  .tile{width:40px;height:40px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--lime)}
  .link .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .link .t b{font-size:15px;font-weight:600}
  .link .t span{font-size:13px;color:var(--muted)}
  .link .arr{color:var(--muted)}

  .chat{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .chat-head .tile{width:30px;height:30px;border-radius:50%}
  .chat-head .tile svg{width:16px;height:16px}
  .chat-head b{font-family:var(--mono);font-size:15px;font-weight:600}
  .chat-head .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--lime)}
  .msgs{height:340px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .m{max-width:86%;padding:11px 13px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .m.bot{background:var(--card2);align-self:flex-start;border-radius:14px 14px 14px 4px}
  .m.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-radius:14px 14px 4px 14px}
  .m.err{background:#3a2424;color:#f5c6c6}
  .m a{color:var(--lime)}
  .m .book{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:40px;padding:0 14px;border:0;border-radius:10px;
    background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13.5px;font-family:inherit;cursor:pointer}
  .m .book svg{width:16px;height:16px}
  .typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--lime)}

  #form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
  #input{flex:1;min-width:0;min-height:46px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 14px;
    color:var(--text);font-size:16px;font-family:inherit;outline:none}
  #input:focus{border-color:var(--lime)}
  .send{width:46px;height:46px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .send svg{width:18px;height:18px;stroke-width:2}
  .send:disabled{opacity:.5}
  footer{text-align:center;font-family:var(--mono);color:#7d828a;font-size:12px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.open{display:flex}
  .sheet{display:block;width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:22px 18px 26px}
  @media(min-width:520px){.modal{align-items:center}.sheet{border-radius:18px}}
  .sheet h2{font-family:var(--mono);font-size:18px;font-weight:600;margin-bottom:6px}
  .sheet p{color:var(--muted);font-size:14px;margin-bottom:14px}
  .sheet label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  .sheet input,.sheet textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;
    color:var(--text);font-size:16px;font-family:inherit;outline:none}
  .sheet textarea{min-height:90px;resize:vertical}
  .sheet input:focus,.sheet textarea:focus{border-color:var(--lime)}
  .sheet .row{display:flex;gap:8px;margin-top:18px}
  .sheet .row button{flex:1;min-height:48px;border-radius:10px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .sheet .cancel{background:transparent;border:1px solid var(--line);color:var(--text)}
  .sheet .submit{background:var(--accent);border:0;color:var(--on-accent)}
  .sheet .submit:disabled{opacity:.5}
  .sheet .status{margin-top:12px;font-size:14px;min-height:20px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>

/* ============================================================ */

const $ = id => document.getElementById(id);
const icon = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
$("name").textContent = CONFIG.name;
$("handle").textContent = CONFIG.handle;
$("bio").textContent = CONFIG.bio;
$("tags").innerHTML = (CONFIG.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
$("footer").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;
$("avatar").innerHTML = `<img src="${CONFIG.avatar}" alt="${CONFIG.name}">`;

$("links").innerHTML = CONFIG.links.map(l => `
  <a class="link" href="${l.url}" target="_blank" rel="noopener">
    <span class="tile">${icon(l.icon)}</span>
    <span class="t"><b>${l.title}</b>${l.sub ? `<span>${l.sub}</span>` : ""}</span>
    <span class="arr">${icon("chev")}</span>
  </a>`).join("");

const msgs = $("msgs"), input = $("input"), send = $("send"), chips = $("chips");
const history = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s)]+|[\w.+-]+@[\w-]+\.[\w.]+)/g,m=>
  m.includes("@")&&!m.startsWith("http")?`<a href="mailto:${m}">${m}</a>`:`<a href="${m}" target="_blank" rel="noopener">${m}</a>`)}
function add(text, who){
  const d = document.createElement("div");
  d.className = "m " + who;
  d.innerHTML = linkify(text);
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  return d;
}

add(CONFIG.greeting, "bot");
chips.innerHTML = CONFIG.suggestions.map(s => `<button class="chip" type="button">${esc(s)}</button>`).join("");
chips.querySelectorAll(".chip").forEach(b => b.onclick = () => ask(b.textContent));

async function ask(text){
  text = text.trim();
  if (!text || send.disabled) return;
  chips.style.display = "none";
  add(text, "me");
  history.push({ role:"user", content:text });
  input.value = ""; send.disabled = true;

  const t = add("", "bot");
  t.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

  try {
    const r = await fetch(CONFIG.WORKER_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ messages: history.slice(-10) }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "error");
    const wantsBooking = data.reply.includes("[ЗАПИСЬ]");
    const reply = data.reply.replace(/\s*\[ЗАПИСЬ\]\s*/g, " ").trim();
    t.innerHTML = linkify(reply);
    if (wantsBooking) {
      const b = document.createElement("button");
      b.className = "book"; b.type = "button";
      b.innerHTML = icon("calendar") + "Записаться";
      b.onclick = openLead; t.appendChild(b);
      msgs.scrollTop = msgs.scrollHeight;
    }
    history.push({ role:"assistant", content:reply });
  } catch (e) {
    history.pop();
    t.className = "m bot err";
    t.textContent = e.message === "rate_limited"
      ? "Слишком много сообщений подряд. Попробуйте через минуту."
      : "Не получилось ответить. Попробуйте ещё раз или напишите в директ " + CONFIG.handle;
  } finally {
    send.disabled = false; input.focus();
  }
}

$("form").onsubmit = e => { e.preventDefault(); ask(input.value); };

// ---------- Запись на консультацию ----------
const modal = $("modal"), leadForm = $("leadForm"), lStatus = $("lStatus"), lSubmit = $("lSubmit");
function openLead(){ modal.classList.add("open"); lStatus.textContent = ""; setTimeout(() => $("lName").focus(), 50); }
function closeLead(){ modal.classList.remove("open"); }
$("cta").onclick = openLead;
$("lCancel").onclick = closeLead;
modal.onclick = e => { if (e.target === modal) closeLead(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLead(); });

leadForm.onsubmit = async e => {
  e.preventDefault();
  lSubmit.disabled = true; lStatus.style.color = ""; lStatus.textContent = "Отправляю…";
  try {
    const r = await fetch(CONFIG.WORKER_URL + "/lead", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name:$("lName").value, contact:$("lContact").value, task:$("lTask").value, website:$("lWeb").value }),
    });
    if (!r.ok) throw new Error();
    leadForm.reset();
    lStatus.style.color = "#c6f432";
    lStatus.textContent = "Готово! Заявка у Мусы, он скоро с вами свяжется.";
    setTimeout(closeLead, 2500);
  } catch {
    lStatus.style.color = "#f5a3a3";
    lStatus.textContent = "Не удалось отправить. Попробуйте ещё раз или напишите в директ " + CONFIG.handle;
  } finally { lSubmit.disabled = false; }
};
</script>
